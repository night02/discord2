name: Veylor preview builds
on:
  # Every new commit to main is a distinct update candidate, even when
  # changes only touch backend or release documentation.
  push:
    branches: [main]
  pull_request:
    paths:
      - "apps/client/**"
      - ".github/workflows/preview-builds.yml"
  workflow_dispatch:
permissions:
  contents: read
# Do not cancel a main release candidate when another update arrives.
# PR superseded builds may still be cancelled to save runner minutes.
concurrency:
  group: preview-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  windows:
    name: Windows x64 installer and portable
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: apps/client
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter config --enable-windows-desktop
      - run: flutter create --project-name veylor --platforms=windows .
      - run: flutter pub get
      - name: Validate Windows signing helper syntax before packaging
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$env:GITHUB_WORKSPACE/tools/sign-windows.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw "Invalid Windows signing helper PowerShell syntax." }
      - name: Apply official Veylor logo to Windows exe and installer
        run: python tool/prepare_brand_icon.py
      - run: flutter build windows --release --build-number=${{ github.run_number }}
      - name: Compile external update runner and release marker
        shell: pwsh
        run: |
          $release = "build/windows/x64/runner/Release"
          "0.5.0" | Set-Content -Path "$release/veylor-version.txt" -NoNewline
          dart compile exe tool/windows_update_runner.dart -o "$release/veylor-updater.exe"
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path "$release/veylor-updater.exe")) {
            throw "Windows rollback runner compilation failed."
          }
      - name: Authenticode sign Windows app if publisher credentials exist
        id: win-app-sign
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          VEYLOR_WINDOWS_PFX_BASE64: ${{ secrets.VEYLOR_WINDOWS_PFX_BASE64 }}
          VEYLOR_WINDOWS_PFX_PASSWORD: ${{ secrets.VEYLOR_WINDOWS_PFX_PASSWORD }}
        run: |
          if (-not $env:VEYLOR_WINDOWS_PFX_BASE64 -and -not $env:VEYLOR_WINDOWS_PFX_PASSWORD) {
            "signed=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Warning "Windows signing credentials not configured: output is UNSIGNED beta."
          } else {
            if (-not $env:VEYLOR_WINDOWS_PFX_BASE64 -or -not $env:VEYLOR_WINDOWS_PFX_PASSWORD) {
              throw "Partial Windows signing credentials. Both certificate and password are required."
            }
            & "$env:GITHUB_WORKSPACE/tools/sign-windows.ps1" -FilePath "build/windows/x64/runner/Release/veylor.exe"
            if ($LASTEXITCODE -ne 0) { throw "Windows app signing failed" }
            & "$env:GITHUB_WORKSPACE/tools/sign-windows.ps1" -FilePath "build/windows/x64/runner/Release/veylor-updater.exe"
            if ($LASTEXITCODE -ne 0) { throw "Windows updater signing failed" }
            "signed=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }
      - name: Pack portable Windows bundle
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath Veylor-v0.5.0-Windows-x64.zip -Force
      - name: Install Inno Setup compiler
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build Windows setup exe
        shell: pwsh
        run: |
          $paths = @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe"
          )
          $compiler = $paths | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $compiler) { throw "Inno Setup ISCC.exe not found" }
          if (-not (Test-Path "build/windows/x64/runner/Release/veylor.exe")) { throw "Veylor exe not found in Windows build" }
          & $compiler "windows-installer.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed ($LASTEXITCODE)" }
          if (-not (Test-Path "dist/Veylor-v0.5.0-Setup-Windows-x64.exe")) { throw "Installer not generated" }
      - name: Authenticode sign Windows installer if app is signed
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.win-app-sign.outputs.signed == 'true'
        shell: pwsh
        env:
          VEYLOR_WINDOWS_PFX_BASE64: ${{ secrets.VEYLOR_WINDOWS_PFX_BASE64 }}
          VEYLOR_WINDOWS_PFX_PASSWORD: ${{ secrets.VEYLOR_WINDOWS_PFX_PASSWORD }}
        run: |
          & "$env:GITHUB_WORKSPACE/tools/sign-windows.ps1" -FilePath "dist/Veylor-v0.5.0-Setup-Windows-x64.exe"
          if ($LASTEXITCODE -ne 0) { throw "Windows installer signing failed" }
      - name: Smoke-test unsigned or signed Windows installer (install and uninstall)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = (Resolve-Path "dist/Veylor-v0.5.0-Setup-Windows-x64.exe").Path
          $compiled = (Resolve-Path "build/windows/x64/runner/Release/veylor.exe").Path
          $installRoot = Join-Path $env:RUNNER_TEMP 'Veylor-Installer-Smoke'
          $installLog = Join-Path $env:RUNNER_TEMP 'veylor-installer-smoke.log'
          if (Test-Path $installRoot) { Remove-Item $installRoot -Recurse -Force }
          $installProcess = Start-Process -FilePath $setup -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$installRoot`"", "/LOG=`"$installLog`"") -Wait -PassThru
          if ($installProcess.ExitCode -ne 0) { throw "Installer failed: $($installProcess.ExitCode)" }
          $installed = Join-Path $installRoot 'veylor.exe'
          if (-not (Test-Path $installed)) { throw 'Installed application EXE missing.' }
          if (-not (Test-Path (Join-Path $installRoot 'veylor-updater.exe'))) { throw 'Rollback helper missing.' }
          if ((Get-Content (Join-Path $installRoot 'veylor-version.txt') -Raw).Trim() -ne '0.5.0') { throw 'Release marker mismatch.' }
          $expected = (Get-FileHash $compiled -Algorithm SHA256).Hash
          $actual = (Get-FileHash $installed -Algorithm SHA256).Hash
          if ($expected -ne $actual) { throw 'Installed EXE hash differs from release build.' }
          # Run the real sidecar (from a separate directory) against this real installer.
          # The first attempt fails the version postcheck and MUST restore the prior EXE.
          $updaterDir = Join-Path $env:RUNNER_TEMP 'veylor-updater-test'
          New-Item -ItemType Directory -Force $updaterDir | Out-Null
          $updater = Join-Path $updaterDir 'veylor-updater.exe'
          Copy-Item (Join-Path $installRoot 'veylor-updater.exe') $updater -Force
          $digest = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          $wrongDigest = '0' * 64
          $PSNativeCommandUseErrorActionPreference = $false # expected nonzero exit codes test rollback
          & $updater '--installer' $setup '--sha256' $wrongDigest '--install-dir' $installRoot '--parent-pid' '999999' '--target-version' '0.5.0' '--no-relaunch' 'true'
          if ($LASTEXITCODE -ne 93) { throw 'Bad SHA-256 was not rejected.' }
          if ((Get-FileHash $installed -Algorithm SHA256).Hash -ne $expected) { throw 'Digest rejection modified installed app.' }
          & $updater '--installer' $setup '--sha256' $digest '--install-dir' $installRoot '--parent-pid' '999999' '--target-version' '9.9.9' '--no-relaunch' 'true'
          if ($LASTEXITCODE -ne 95) { throw 'Failed postcheck did not rollback.' }
          if ((Get-FileHash $installed -Algorithm SHA256).Hash -ne $expected) { throw 'Rollback failed to restore installed app.' }
          # Simulate a successful install followed by a crash BEFORE startup receipt.
          # The complete previous directory must be restored in this case.
          & $updater '--installer' $setup '--sha256' $digest '--install-dir' $installRoot '--parent-pid' '999999' '--target-version' '0.5.0' '--no-relaunch' 'true' '--test-startup-fail' 'true'
          if ($LASTEXITCODE -ne 95) { throw 'Startup failure did not trigger automatic rollback.' }
          if ((Get-FileHash $installed -Algorithm SHA256).Hash -ne $expected) { throw 'Startup rollback lost previous application.' }
          & $updater '--installer' $setup '--sha256' $digest '--install-dir' $installRoot '--parent-pid' '999999' '--target-version' '0.5.0' '--no-relaunch' 'true'
          if ($LASTEXITCODE -ne 0) { throw 'Valid staged update did not install.' }
          if ((Get-FileHash $installed -Algorithm SHA256).Hash -ne $expected) { throw 'Updated executable hash mismatch.' }
          $uninstaller = Join-Path $installRoot 'unins000.exe'
          if (-not (Test-Path $uninstaller)) { throw 'Uninstaller is missing.' }
          $uninstallProcess = Start-Process -FilePath $uninstaller -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART') -Wait -PassThru
          if ($uninstallProcess.ExitCode -ne 0) { throw "Uninstaller failed: $($uninstallProcess.ExitCode)" }
          if (Test-Path $installed) { throw 'Uninstaller left application EXE installed.' }
          Write-Host 'Windows beta installer smoke test passed without requiring a publisher certificate.'
      - name: Record Windows signature status
        shell: pwsh
        run: |
          if ("${{ steps.win-app-sign.outputs.signed }}" -eq "true") { "signed" | Set-Content -Path windows-signing-status.txt }
          else { "unsigned" | Set-Content -Path windows-signing-status.txt }
      - uses: actions/upload-artifact@v4
        with:
          name: Veylor-v0.5.0-Windows-signature-status
          path: apps/client/windows-signing-status.txt
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: Veylor-v0.5.0-Setup-Windows-x64
          path: apps/client/dist/Veylor-v0.5.0-Setup-Windows-x64.exe
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: Veylor-v0.5.0-Windows-x64
          path: apps/client/Veylor-v0.5.0-Windows-x64.zip
          if-no-files-found: error
          retention-days: 7
  linux:
    name: Linux x64 portable
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: apps/client
    steps:
      - uses: actions/checkout@v4
      - name: Install native desktop dependencies
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev libjsoncpp-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter config --enable-linux-desktop
      - run: flutter create --project-name veylor --platforms=linux .
      - run: flutter pub get
      - run: flutter build linux --release --build-number=${{ github.run_number }}
      - name: Pack Linux bundle
        run: tar -C build/linux/x64/release/bundle -czf Veylor-v0.5.0-Linux-x64.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: Veylor-v0.5.0-Linux-x64
          path: apps/client/Veylor-v0.5.0-Linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 7
  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --project-name veylor --platforms=android .
      - name: Apply Veylor launcher icon on Android
        run: python3 tool/prepare_brand_android.py
      - name: Grant only foreground Android voice permissions
        run: python3 tool/prepare_voice_android.py
      - run: flutter pub get
      - name: Ensure Android API 36 compatibility for LiveKit AI noise filter
        run: python3 tool/prepare_noise_android.py
      - run: flutter build apk --debug --build-number=${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: Veylor-v0.5.0-Android-debug
          path: apps/client/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
      - name: Integration-test Android release APK and AAB with disposable CI-only signing key
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          VEYLOR_KEY_ALIAS: veylor-ci
          VEYLOR_KEY_PASSWORD: ci-throwaway-password
          VEYLOR_STORE_PASSWORD: ci-throwaway-password
          VEYLOR_KEYSTORE_PATH: veylor-release.jks
        run: |
          set -euo pipefail
          trap 'rm -f android/app/veylor-release.jks' EXIT
          keytool -genkeypair -noprompt -storetype PKCS12 -keystore android/app/veylor-release.jks -alias veylor-ci -keyalg RSA -keysize 2048 -validity 2 -storepass ci-throwaway-password -keypass ci-throwaway-password -dname "CN=CI Test, O=Veylor, C=BR"
          python3 tool/configure_android_signing.py
          flutter build apk --release --build-number=${{ github.run_number }}
          flutter build appbundle --release --build-number=${{ github.run_number }}
          apk=build/app/outputs/flutter-apk/app-release.apk
          aab=build/app/outputs/bundle/release/app-release.aab
          test -s "$apk" && test -s "$aab"
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          signer=$(find "$sdk/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          "$signer" verify "$apk"
          jarsigner -verify "$aab" > /dev/null
          echo "Disposable CI key verified APK and AAB (test-only; no signed artifact uploaded)."
      - name: Build permanent-key Android release APK and Play Store AAB, if configured
        id: android-sign
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          VEYLOR_KEY_ALIAS: ${{ secrets.VEYLOR_ANDROID_KEY_ALIAS }}
          VEYLOR_KEY_PASSWORD: ${{ secrets.VEYLOR_ANDROID_KEY_PASSWORD }}
          VEYLOR_STORE_PASSWORD: ${{ secrets.VEYLOR_ANDROID_STORE_PASSWORD }}
          VEYLOR_KEYSTORE_BASE64: ${{ secrets.VEYLOR_ANDROID_KEYSTORE_BASE64 }}
          VEYLOR_ANDROID_CERT_SHA256: ${{ secrets.VEYLOR_ANDROID_CERT_SHA256 }}
          VEYLOR_KEYSTORE_PATH: veylor-release.jks
        run: |
          set -euo pipefail
          if [[ -z "$VEYLOR_KEY_ALIAS" && -z "$VEYLOR_KEY_PASSWORD" && -z "$VEYLOR_STORE_PASSWORD" && -z "$VEYLOR_KEYSTORE_BASE64" && -z "$VEYLOR_ANDROID_CERT_SHA256" ]]; then
            echo "::warning::No Android release credentials configured; publishing debug APK only."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for name in VEYLOR_KEY_ALIAS VEYLOR_KEY_PASSWORD VEYLOR_STORE_PASSWORD VEYLOR_KEYSTORE_BASE64 VEYLOR_ANDROID_CERT_SHA256; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Incomplete Android signing setup (missing $name)."
              exit 1
            fi
          done
          trap 'rm -f android/app/veylor-release.jks' EXIT
          python3 - <<'PY'
          import os, pathlib, base64
          raw=base64.b64decode(os.environ['VEYLOR_KEYSTORE_BASE64'],validate=True)
          if len(raw)<200: raise SystemExit('Invalid Android signing keystore')
          path=pathlib.Path('android/app/veylor-release.jks')
          path.write_bytes(raw)
          path.chmod(0o600)
          PY
          python3 tool/configure_android_signing.py
          flutter build apk --release --build-number=${{ github.run_number }}
          flutter build appbundle --release --build-number=${{ github.run_number }}
          apk=build/app/outputs/flutter-apk/app-release.apk
          aab=build/app/outputs/bundle/release/app-release.aab
          test -s "$apk" && test -s "$aab"
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          signer=$(find "$sdk/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          if [[ -z "$signer" ]]; then echo "::error::Missing Android apksigner"; exit 1; fi
          actual=$("$signer" verify --print-certs "$apk" | sed -nE 's/^Signer #1 certificate SHA-256 digest: ([0-9a-fA-F]{64})$/\1/p' | head -n 1 | tr '[:upper:]' '[:lower:]')
          expected=$(printf '%s' "$VEYLOR_ANDROID_CERT_SHA256" | tr -d ': ' | tr '[:upper:]' '[:lower:]')
          if [[ ! "$expected" =~ ^[0-9a-f]{64}$ || "$actual" != "$expected" ]]; then
            echo "::error::APK signer fingerprint mismatch. Refusing release."
            exit 1
          fi
          jarsigner -verify "$aab" >/dev/null
          aab_cert=$(keytool -printcert -jarfile "$aab" | sed -nE 's/^[[:space:]]*SHA256:[[:space:]]*([0-9a-fA-F:]+).*$/\1/p' | head -n 1 | tr -d ':' | tr '[:upper:]' '[:lower:]')
          if [[ "$aab_cert" != "$expected" ]]; then
            echo "::error::AAB upload signature does not match the expected certificate."
            exit 1
          fi
          echo "signed=true" >> "$GITHUB_OUTPUT"
          echo "Verified Android APK + AAB signed with the permanent publisher upload key."
      - uses: actions/upload-artifact@v4
        if: steps.android-sign.outputs.signed == 'true'
        with:
          name: Veylor-v0.5.0-Android-release-APK
          path: apps/client/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: steps.android-sign.outputs.signed == 'true'
        with:
          name: Veylor-v0.5.0-Android-Play-AAB
          path: apps/client/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
