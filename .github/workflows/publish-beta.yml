name: Veylor beta Releases
on:
  pull_request:
    paths:
      - "apps/client/**"
      - ".github/workflows/publish-beta.yml"
      - ".github/workflows/preview-builds.yml"
  workflow_run:
    workflows: ["Veylor preview builds"]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: veylor-beta-${{ github.event.workflow_run.head_sha || github.ref }}
  cancel-in-progress: false
jobs:
  lint-release:
    name: Validate beta release definition
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify matching application and installer versions
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -nE 's/^version: ([0-9]+\.[0-9]+\.[0-9]+)\+[0-9]+$/\1/p' apps/client/pubspec.yaml)
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid Flutter beta version"
            exit 1
          fi
          grep -Fq "#define MyAppVersion \"$version\"" apps/client/windows-installer.iss
          grep -Fq "Veylor-v$version-Setup-Windows-x64" .github/workflows/preview-builds.yml
          grep -Fq 'name: Veylor preview builds' .github/workflows/preview-builds.yml

  publish:
    name: Publish verified beta installer and portable builds
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      BUILD_RUN: ${{ github.event.workflow_run.id }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Verify main commit, build identity, version and unique release tag
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          current_main=$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')
          if [[ "$HEAD_SHA" != "$current_main" ]]; then
            echo "::error::Build commit is not the current main branch; refusing to publish stale code."
            exit 1
          fi
          details=$(gh run view "$BUILD_RUN" --repo "$GITHUB_REPOSITORY" --json headBranch,headSha,conclusion,workflowName,event)
          if ! echo "$details" | jq -e --arg sha "$HEAD_SHA" \
            '.headBranch == "main" and .headSha == $sha and .conclusion == "success" and .workflowName == "Veylor preview builds" and .event == "push"' > /dev/null; then
            echo "::error::Expected a successful main push preview build with the exact same commit SHA."
            exit 1
          fi
          version=$(sed -nE 's/^version: ([0-9]+\.[0-9]+\.[0-9]+)\+[0-9]+$/\1/p' apps/client/pubspec.yaml)
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid beta version in pubspec.yaml"
            exit 1
          fi
          grep -Fq "#define MyAppVersion \"$version\"" apps/client/windows-installer.iss
          grep -Fq "Veylor-v$version-Setup-Windows-x64" .github/workflows/preview-builds.yml
          tag="v$version-beta.$BUILD_RUN"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $tag already exists. Nothing will be overwritten."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Require Flutter, API and hosted smoke tests on this exact main commit
        if: steps.metadata.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 70); do
            current_main=$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')
            if [[ "$current_main" != "$HEAD_SHA" ]]; then
              echo "::error::Main advanced while checking tests. Do not publish stale packages."
              exit 1
            fi
            approved=0
            for workflow in "API tests" "Flutter analyze and tests" "Veylor hosted Postgres health"; do
              runs=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" \
                --branch main --commit "$HEAD_SHA" --event push --limit 30 \
                --json headSha,headBranch,conclusion)
              if echo "$runs" | jq -e --arg sha "$HEAD_SHA" \
                'any(.[]; .headSha == $sha and .headBranch == "main" and .conclusion == "success")' > /dev/null; then
                approved=$((approved + 1))
              else
                echo "Waiting for passing workflow: $workflow"
              fi
            done
            if [[ "$approved" == "3" ]]; then
              echo "All required workflow suites passed on the same SHA."
              exit 0
            fi
            sleep 15
          done
          echo "::error::At least one required CI workflow did not pass for this main commit."
          exit 1

      - name: Fetch and validate all four build artifacts
        if: steps.metadata.outputs.exists != 'true'
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-out fetched/setup fetched/windows fetched/linux fetched/android
          gh run download "$BUILD_RUN" --repo "$GITHUB_REPOSITORY" --name "Veylor-v$VERSION-Setup-Windows-x64" --dir fetched/setup
          gh run download "$BUILD_RUN" --repo "$GITHUB_REPOSITORY" --name "Veylor-v$VERSION-Windows-x64" --dir fetched/windows
          gh run download "$BUILD_RUN" --repo "$GITHUB_REPOSITORY" --name "Veylor-v$VERSION-Linux-x64" --dir fetched/linux
          gh run download "$BUILD_RUN" --repo "$GITHUB_REPOSITORY" --name "Veylor-v$VERSION-Android-debug" --dir fetched/android
          cp "fetched/setup/Veylor-v$VERSION-Setup-Windows-x64.exe" release-out/
          cp "fetched/windows/Veylor-v$VERSION-Windows-x64.zip" release-out/
          cp "fetched/linux/Veylor-v$VERSION-Linux-x64.tar.gz" release-out/
          cp fetched/android/app-debug.apk "release-out/Veylor-v$VERSION-Android-debug-TEST-ONLY.apk"
          for file in release-out/*; do test -s "$file" || exit 1; done
          test "$(head -c 2 "release-out/Veylor-v$VERSION-Setup-Windows-x64.exe")" = "MZ"
          unzip -t "release-out/Veylor-v$VERSION-Windows-x64.zip" > /dev/null
          unzip -t "release-out/Veylor-v$VERSION-Android-debug-TEST-ONLY.apk" > /dev/null
          tar -tzf "release-out/Veylor-v$VERSION-Linux-x64.tar.gz" > /dev/null
          (cd release-out && sha256sum Veylor-* > SHA256SUMS.txt)

      - name: Collect signed publisher builds when available, and report provenance
        if: steps.metadata.outputs.exists != 'true'
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          gh run download "$BUILD_RUN" --repo "$GITHUB_REPOSITORY" --name "Veylor-v$VERSION-Windows-signature-status" --dir fetched/windows-signature
          win_state=$(tr -d '\r\n ' < fetched/windows-signature/windows-signing-status.txt)
          if [[ "$win_state" != "signed" && "$win_state" != "unsigned" ]]; then
            echo "::error::Unrecognized Windows publisher signature status."
            exit 1
          fi
          echo "WIN_SIGNED=$win_state" >> "$GITHUB_ENV"
          artifact_names=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN/artifacts?per_page=100" --jq '.artifacts[].name')
          apk_present=false
          aab_present=false
          if printf '%s\n' "$artifact_names" | grep -Fxq "Veylor-v$VERSION-Android-release-APK"; then apk_present=true; fi
          if printf '%s\n' "$artifact_names" | grep -Fxq "Veylor-v$VERSION-Android-Play-AAB"; then aab_present=true; fi
          if [[ "$apk_present" != "$aab_present" ]]; then
            echo "::error::Partial Android signing artifacts. Refusing to publish."
            exit 1
          fi
          if [[ "$apk_present" == "true" ]]; then
            mkdir -p fetched/signed-apk fetched/signed-aab
            gh run download "$BUILD_RUN" --repo "$GITHUB_REPOSITORY" --name "Veylor-v$VERSION-Android-release-APK" --dir fetched/signed-apk
            gh run download "$BUILD_RUN" --repo "$GITHUB_REPOSITORY" --name "Veylor-v$VERSION-Android-Play-AAB" --dir fetched/signed-aab
            test -s fetched/signed-apk/app-release.apk
            test -s fetched/signed-aab/app-release.aab
            unzip -t fetched/signed-apk/app-release.apk > /dev/null
            unzip -t fetched/signed-aab/app-release.aab > /dev/null
            cp fetched/signed-apk/app-release.apk "release-out/Veylor-v$VERSION-Android-signed.apk"
            cp fetched/signed-aab/app-release.aab "release-out/Veylor-v$VERSION-Android-Play-upload.aab"
            echo "ANDROID_SIGNED=true" >> "$GITHUB_ENV"
          else
            echo "ANDROID_SIGNED=false" >> "$GITHUB_ENV"
          fi
          (cd release-out && sha256sum Veylor-* > SHA256SUMS.txt)

      - name: Publish immutable GitHub beta prerelease
        if: steps.metadata.outputs.exists != 'true'
        env:
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
          VERSION: ${{ steps.metadata.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          current_main=$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')
          if [[ "$HEAD_SHA" != "$current_main" ]]; then
            echo "::error::Main advanced since verification, refusing to release old commit."
            exit 1
          fi
          if [[ "${ANDROID_SIGNED:-false}" == "true" ]]; then ANDROID_STATUS="Permanent-key APK and Play upload AAB available (verified)"; else ANDROID_STATUS="Not configured (debug only)"; fi
          if [[ "${WIN_SIGNED:-unsigned}" == "signed" ]]; then WINDOWS_STATUS="Trusted timestamped signature verified"; else WINDOWS_STATUS="UNSIGNED (trusted publisher certificate needed)"; fi
          cat > release-notes.md <<EOF
          ## Veylor v$VERSION beta

          Automatically packaged from successful Windows, Linux and Android builds.
          All required CI workflows passed on commit: $HEAD_SHA.

          - **Windows:** download \`Veylor-v$VERSION-Setup-Windows-x64.exe\` to install, or use the portable ZIP.
          - **Linux:** complete portable tarball.
          - **Android debug:** TEST ONLY. Install the signed APK if present, not debug.
          - **Android publisher signing:** $ANDROID_STATUS. Play Console uses the AAB when configured.
          - Check \`SHA256SUMS.txt\` to verify the downloaded files.
          - **Windows Authenticode:** $WINDOWS_STATUS.
          - Installation is manual. No unattended updates or backend deployments.
          - Build source: https://github.com/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN
          EOF
          gh release create "$RELEASE_TAG" release-out/* \
            --repo "$GITHUB_REPOSITORY" --target "$HEAD_SHA" \
            --title "Veylor v$VERSION beta • build $BUILD_RUN" \
            --notes-file release-notes.md --prerelease
